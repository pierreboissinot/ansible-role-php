---
- name: Ensure PHP packages are installed.
  community.general.zypper:
    name: "{{ php_packages + php_packages_extra }}"
    state: "{{ php_packages_state }}"
    update_cache: true
  register: php_package_install
  notify: restart webserver

# openSUSE distro packaging ships php-fpm.conf as php-fpm.conf.default only
# (the OBS devel:languages:php builds ship a real php-fpm.conf); the service
# cannot start until a real configuration file exists.
- name: Check for SUSE-shipped php-fpm.conf.default.
  ansible.builtin.stat:
    path: "{{ php_fpm_conf_path }}/php-fpm.conf.default"
  register: php_fpm_conf_default
  when: php_enable_php_fpm

- name: Materialize php-fpm.conf from the SUSE-shipped default.
  ansible.builtin.copy:
    src: "{{ php_fpm_conf_path }}/php-fpm.conf.default"
    dest: "{{ php_fpm_conf_path }}/php-fpm.conf"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: 0644
  when: php_enable_php_fpm and php_fpm_conf_default.stat.exists

- name: Delete APCu configuration file if this role will provide one.
  file:
    path: "{{ item }}/{{ php_apc_conf_filename }}"
    state: absent
  with_items: "{{ php_extension_conf_paths }}"
  when: php_enable_apc and php_package_install.changed
  notify: restart webserver

- name: Delete OpCache configuration file if this role will provide one.
  file:
    path: "{{ item }}/{{ php_opcache_conf_filename }}"
    state: absent
  with_items: "{{ php_extension_conf_paths }}"
  when: php_opcache_enable | bool and php_package_install.changed
  notify: restart webserver
